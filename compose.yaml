name: wedding-timeline
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: wedding
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: { context: ., target: base }
    environment:
      APP_ENV: local
      LOCAL_DATABASE_URL: postgres://wedding:local-only@db:5432/wedding
      ORGANISER_CREDENTIAL: ${ORGANISER_CREDENTIAL:?Create .env using the README first}
    ports: ["127.0.0.1:8888:8888"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8888/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: wedding_test
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build: { context: ., target: test }
    profiles: ["test"]
    environment:
      APP_ENV: test
      LOCAL_DATABASE_URL: postgres://wedding:test-only@test-db:5432/wedding_test
      WEDDING_ACCESS_CODE: test-wedding-code-only
      ORGANISER_CREDENTIAL: test-organiser-secret-only
    depends_on: { test-db: { condition: service_healthy } }
    volumes: ["./test-results:/app/test-results"]
    command: ["sh", "-c", "npm run db:migrate:local && npm test && npm run test:browser"]
volumes:
  database:
